stages:
  - quality
  - release
  - promote-dev
  - promote-sit

default:
  image: node:22-bookworm
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile

.evidence:
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/

lint:
  stage: quality
  script: ["pnpm lint"]

typecheck:
  stage: quality
  script: ["pnpm typecheck"]

unit-and-api:
  stage: quality
  script:
    - IRIS_TEST_REPORT_DIR=artifacts/tests pnpm test
    - pnpm test:coverage
    - node --test scripts/ci/release-manifest.test.mjs
  artifacts:
    when: always
    expire_in: 30 days
    reports: { junit: "artifacts/tests/junit.xml" }
    paths: ["artifacts/"]

migrations:
  stage: quality
  script:
    - node scripts/ci/verify-migrations.mjs
    - pnpm --filter @opengym/api test
  extends: .evidence

browser-a11y:
  stage: quality
  script:
    - pnpm --filter @opengym/e2e exec playwright install --with-deps chromium
    - pnpm --filter @opengym/e2e test --project=chromium
  extends: .evidence

dependency-scan:
  stage: quality
  script:
    - mkdir -p artifacts/dependency-scan
    - pnpm audit --audit-level=high > artifacts/dependency-scan/pnpm-audit.txt 2>&1
  extends: .evidence

sbom:
  stage: quality
  script:
    - npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --output-file artifacts/sbom.cdx.json
  extends: .evidence

lighthouse:
  stage: quality
  script:
    - test -n "$LIGHTHOUSE_URL"
    - npx --yes @lhci/cli@0.16.1 collect --url="$LIGHTHOUSE_URL" --numberOfRuns=1 --settings.preset=perf --settings.emulatedFormFactor=mobile
    - mkdir -p artifacts/lighthouse
    - cp -R .lighthouseci artifacts/lighthouse/results
  extends: .evidence

health-load:
  stage: quality
  image: grafana/k6:0.56.0
  script:
    - test -n "$K6_BASE_URL"
    - mkdir -p artifacts/load
    - k6 run --summary-export artifacts/load/summary.json load/health.js
  extends: .evidence

release-pair:
  stage: release
  needs: [lint, typecheck, unit-and-api, migrations, browser-a11y, dependency-scan, sbom, lighthouse, health-load]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - export RELEASE_TAG="$CI_COMMIT_SHA"
    - export REGISTRY_IMAGE="$CI_REGISTRY_IMAGE"
    - node scripts/ci/release-manifest.mjs artifacts/release/release-manifest.json
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" -f apps/web/Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" -f apps/api/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
  extends: .evidence

promote-dev:
  stage: promote-dev
  needs: [release-pair]
  when: manual
  variables:
    TARGET_ENV: dev
  script: ["node scripts/ci/promote-release.mjs"]
  extends: .evidence

promote-sit:
  stage: promote-sit
  needs: [promote-dev]
  when: manual
  variables:
    TARGET_ENV: sit
    DEV_PROMOTION_EVIDENCE: artifacts/promotion/dev.jsonl
  script: ["node scripts/ci/promote-release.mjs"]
  extends: .evidence
